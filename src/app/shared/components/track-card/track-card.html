<div class="h-full w-100 max-w-sm overflow-hidden rounded-2xl bg-[#003333] border-2 border-[#D4AF37] shadow-md">
  <div class="flex h-full min-h-64 flex-col p-5">

    <h2 class="text-xl font-bold text-[#FFD700]">
      {{ track.title }}
    </h2>

    <p class="mt-2 text-[#D4AF37]">
      {{ track.description }}
    </p>

    <div class="mt-auto flex gap-3 pt-5">
      <button
        [routerLink]="['/track', track.id]"
        class="rounded-lg bg-[#D4AF37] px-4 py-2 text-[#003300] hover:bg-[#b8860b]">
        {{ languageService.translate('viewTrack') }}
      </button>

      <button
        (click)="bookTrack()"
        class="rounded-lg border border-[#D4AF37] px-4 py-2 text-[#D4AF37] hover:bg-[#004444]">
        {{ languageService.translate('bookTrack') }}
      </button>
    </div>

  </div>
</div>
