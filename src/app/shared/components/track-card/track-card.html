<article class="track-card-shell h-full w-full max-w-sm overflow-hidden rounded-2xl shadow-md">
  <div class="track-card-content flex h-full min-h-64 flex-col p-5">

    <h2 class="track-card-title text-xl font-bold">
      {{ track.title }}
    </h2>

    <p class="track-card-description mt-2">
      {{ track.description }}
    </p>

    <div class="mt-auto flex gap-3 pt-5">
      <button
        [routerLink]="['/track', track.id]"
        class="track-card-primary rounded-lg px-4 py-2 font-semibold">
        {{ languageService.translate('viewTrack') }}
      </button>

      <button
        (click)="bookTrack()"
        class="track-card-secondary rounded-lg border px-4 py-2 font-semibold">
        {{ languageService.translate('bookTrack') }}
      </button>
    </div>

  </div>
</article>
