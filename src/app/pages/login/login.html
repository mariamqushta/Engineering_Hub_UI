<main class="auth-page">
  <section class="auth-card">
    <header class="islamic-banner auth-heading">
      <p class="banner-eyebrow">{{ languageService.translate('islamicLearningPlatform') }}</p>
      <h1>{{ languageService.translate('login') }}</h1>
    </header>

    <form (ngSubmit)="login()" #loginForm="ngForm" class="auth-form">

      <input
        type="text"
        name="userName"
        [(ngModel)]="userName"
        [placeholder]="languageService.translate('username')"
        class="auth-input"
        autocomplete="username"
        required
      >

      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        [placeholder]="languageService.translate('password')"
        class="auth-input"
        autocomplete="current-password"
        required
      >

      @if (errorMessage) {
        <p class="text-sm text-red-600" role="alert">
          {{ errorMessage }}
        </p>
      }

      <button
        type="submit"
        [disabled]="loginForm.invalid || isLoading"
        class="auth-submit disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ isLoading
          ? languageService.translate('loggingIn')
          : languageService.translate('login') }}
      </button>

    </form>
  </section>
</main>
