<div class="mt-8 w-11/12 mx-auto bg-[#081A3A] text-[#49DCEB]">
  <input
    type="text"
    [(ngModel)]="searchText"
    (input)="searchTracks()"
    [placeholder]="languageService.translate('searchTracksPlaceholder')"
    class="w-full rounded-lg border border-[#49DCEB] px-4 py-3 outline-none focus:border-[#49DCEB]"
  >
</div>

<div class="mt-8 w-11/12 mx-auto grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-3">
  @for (track of filteredTracks; track track.id) {
    <app-track-card
      class="m-auto"
      [track]="track">
    </app-track-card>
  } @empty {
    <p class="col-span-full text-center text-gray-500">
      {{ languageService.translate('noTracksFound') }}
    </p>
  }
</div>
