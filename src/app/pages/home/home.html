<div class="home-search mt-8 mx-auto w-11/12">
  <input
    type="text"
    [(ngModel)]="searchText"
    (input)="searchTracks()"
    [placeholder]="languageService.translate('searchTracksPlaceholder')"
    class="home-search-input w-full rounded-lg px-4 py-3 outline-none"
  >
</div>

<div class="mt-8 mx-auto grid w-11/12 grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-3">
  @for (track of filteredTracks; track track.id) {
    <app-track-card
      class="m-auto"
      [track]="track">
    </app-track-card>
  } @empty {
    <p class="col-span-full text-center text-gray-500">
      {{ languageService.translate('noTracksFound') }}
    </p>
  }
</div>
