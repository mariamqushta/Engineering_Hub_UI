

<main class="auth-page">
  <section class="auth-card">
    <header class="islamic-banner auth-heading">
      <p class="banner-eyebrow">{{ languageService.translate('islamicLearningPlatform') }}</p>
      <h1>{{ languageService.translate('register') }}</h1>
    </header>

    <form (ngSubmit)="register()" class="auth-form" novalidate>

      <input
        type="text"
        name="fullName"
        [(ngModel)]="fullName"
        [placeholder]="languageService.translate('fullName')"
        class="auth-input"
        required
      >

      <input
        type="text"
        name="userName"
        [(ngModel)]="userName"
        [placeholder]="languageService.translate('username')"
        class="auth-input"
        required
      >

      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        [placeholder]="languageService.translate('emailAddress')"
        autocomplete="email"
        class="auth-input"
      >

      <input
        type="tel"
        name="phoneNumber"
        [(ngModel)]="phoneNumber"
        [placeholder]="languageService.translate('phoneNumber')"
        autocomplete="tel"
        class="auth-input"
      >

      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        [placeholder]="languageService.translate('password')"
        class="auth-input"
        required
      >

      <select
        name="role"
        [(ngModel)]="role"
        class="auth-input">

        <option value="Student">
          Student
        </option>

        <option value="Instructor">
          Instructor
        </option>

      </select>

      @if (role === 'Student') {
        <select
          name="accountType"
          [(ngModel)]="accountType"
          class="auth-input">


          <option [ngValue]="0">
            Group Student
          </option>

          <option [ngValue]="1">
            Private Student
          </option>

        </select>
      }


      @if (errorMessage) {
        <p class="text-sm text-red-600" role="alert">
          {{ errorMessage }}
        </p>
      }

      <button
        type="submit"
        class="auth-submit">
        {{ languageService.translate('register') }}
      </button>

    </form>

  </section>
</main>
