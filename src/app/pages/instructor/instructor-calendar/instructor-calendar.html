<div class="grid grid-cols-7 min-w-[700px]">

  <div *ngIf="loading" role="status" aria-live="polite">
    <div class="mx-auto h-9 w-9 animate-spin rounded-full
                border-4 border-[#d9e5ef]
                border-t-[#41a6b1]">
    </div>

    <p class="mt-3 text-center text-sm text-gray-500">
      {{ languageService.translate('loadingYourCalendar') }}
    </p>
  </div>

  <div
    *ngFor="let weekday of weekdays"
    class="border-b border-r border-gray-200 bg-gray-50
           p-3 text-center text-sm font-semibold text-gray-500">
    {{ languageService.translate(weekday) }}
  </div>

  <div
    *ngFor="let day of calendarDays; trackBy: trackDay"
    class="min-h-[140px] border-b border-r border-gray-200
           bg-white p-2 transition-colors hover:bg-gray-50"
    [ngClass]="{
      'bg-gray-50 text-gray-400': !day.inCurrentMonth,
      'bg-cyan-50': day.isToday
    }">

    <div
      class="mb-2 flex h-[30px] w-[30px] items-center
             justify-center rounded-full text-sm font-semibold"
      [ngClass]="day.isToday
        ? 'bg-[#182f57] text-white'
        : 'text-[#29456E]'">
      {{ day.date | date:'d' }}
    </div>

    <div class="flex flex-col gap-2">
      <div
        *ngFor="let event of day.events; trackBy: trackEvent"
        class="rounded-md border-l-[3px] p-2 text-xs"
        [ngClass]="event.eventType === 'Workshop'
          ? 'border-orange-400 bg-orange-50 text-orange-800'
          : 'border-[#41a6b1] bg-cyan-50 text-cyan-800'">

        <p class="break-words font-semibold">
          {{ event.title }}
        </p>

        <p class="mt-1">
          {{ event.startDateTime | date:'shortTime' }}
          – {{ event.endDateTime | date:'shortTime' }}
        </p>
      </div>
    </div>
  </div>
</div>
